name: CI - Pull & Verify image from GHCR

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Quyền tối thiểu cho GITHUB_TOKEN: chỉ đọc code và đọc packages (GHCR)
permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: payment-service
  IMAGE_TAG: 1.0.0

jobs:
  pull-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # GHCR bắt buộc tên viết thường: "Chuongpham2004" -> "chuongpham2004"
      - name: Chuan hoa ten image ve chu thuong
        run: |
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
          echo "IMAGE=${REGISTRY}/${OWNER_LC}/${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_ENV"

      # Đăng nhập bằng GITHUB_TOKEN có sẵn, không cần PAT cá nhân
      - name: Dang nhap GHCR bang GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull "$IMAGE"

      - name: Chay container verify o che do nen (detached)
        run: docker run -d --name payment-service -p 8080:8080 "$IMAGE"

      - name: Kiem tra ung dung khoi dong thanh cong
        run: |
          for i in $(seq 1 15); do
            if docker logs payment-service 2>&1 | grep -q "Started "; then
              docker logs payment-service
              echo "✅ payment-service khoi dong thanh cong"
              exit 0
            fi
            sleep 1
          done
          docker logs payment-service
          echo "❌ Ung dung khong khoi dong duoc"
          exit 1

      - name: Don dep
        if: always()
        run: docker rm -f payment-service || true
